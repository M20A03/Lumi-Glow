<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- Critical: viewport-fit=cover prevents notch cutoff on iPhone/iPad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F0" />
    <title>LumiGlow — Premium Natural Skincare | Glow From Within</title>
    <meta name="description" content="Discover LumiGlow — premium natural skincare formulated with botanicals and science. Serums, moisturizers, masks and more. Free shipping over $50." />
    
    <!-- Preload fonts with font-display: swap to prevent invisible text flashing (FOIT) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Zero-FOUC Theme Script: Inlined directly in head before CSS or DOM execution -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('lumiglow-theme-preference');
          var theme = stored;
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
